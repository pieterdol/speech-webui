name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"        # what setup.sh builds the app venv with
          cache: pip
          cache-dependency-path: requirements-test.txt

      - run: pip install -r requirements-test.txt

      # The export tests skip themselves without ffmpeg, and the frontend parse check skips
      # without node — a green run that quietly tested neither is worse than a red one, so
      # both are asserted present rather than left to a skip nobody reads.
      - name: Tools the suite needs
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
          node --version

      - run: pytest
