name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Turns "skip the tests that need a tool" into "fail because the tool is missing".
      # A green run that quietly tested neither the export nor the page script is worse than
      # a red one, and a shell check is too easy to write in a way that can't fail.
      STRICT_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"        # what setup.sh builds the app venv with
          cache: pip
          cache-dependency-path: requirements-test.txt

      # ubuntu-latest doesn't carry ffmpeg, and the export tests build real opus and read the
      # chapter marks back out of a real .m4b.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - run: pip install -r requirements-test.txt

      - run: pytest
