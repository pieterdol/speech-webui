[pytest]
testpaths = tests
# speech.py sits at the repo root and is imported as a plain module, so the root has to be
# importable. conftest.py also inserts it, for running pytest from anywhere.
pythonpath = .
addopts = -q --strict-markers
filterwarnings =
    # Any exception escaping a daemon thread is a test leaking a worker into the next one.
    error::pytest.PytestUnhandledThreadExceptionWarning
